name: Android Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'
          architecture: 'x64'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Download gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -L https://services.gradle.org/distributions/gradle-8.5-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
      - name: Build Android App Bundle
        run: ./gradlew bundleRelease
