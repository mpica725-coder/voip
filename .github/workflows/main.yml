name: Android Build
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '11'
          architecture: 'x64'
      - name: Build Android App Bundle
        run: ./gradlew bundleRelease
        
